<h1>Cane's Sauce Recipe</h1>


  <h2>½ cup mayonnaise</h2>
  <h3>½ teaspoon salt (optional, to taste)</h3>
  <h4> ¼ cup ketchup</h4>
  <h5> 1 teaspoon garlic powder</h5>
  <h6>1 teaspoon Worcestershire sauce</h6>
  <h7>½ teaspoon black pepper (freshly ground is best)</h7>
